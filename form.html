<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f1115;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e5e7eb;
    }

    .card {
      width: 360px;
      padding: 28px;
      background: #151922;
      border-radius: 10px;
      border: 1px solid #222735;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 20px;
      text-align: center;
      letter-spacing: 1px;
    }

    .tag {
      text-align: center;
      margin-bottom: 14px;
      font-size: 11px;
      color: #6b7280;
      letter-spacing: 2px;
    }

    label {
      font-size: 12px;
      color: #9ca3af;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      background: #0f1115;
      border: 1px solid #2a2f3d;
      border-radius: 6px;
      color: #e5e7eb;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #4f46e5;
    }

    input::placeholder {
      color: #6b7280;
    }

    input[type="submit"] {
      background: #4f46e5;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background: #4338ca;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="tag">STUDENT . REGISTRATION</div>
    <h2>Registration</h2>

    <form onsubmit="return validateForm()">
      <label>Name</label>
      <input type="text" id="name" placeholder="Full name">

      <label>Email</label>
      <input type="text" id="email" placeholder="you@email.com">

      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••">

      <label>Mobile</label>
      <input type="text" id="mobile" placeholder="1234567890">

      <input type="submit" value="Create Account">
    </form>
  </div>

  <!-- LINKED EXTERNAL JAVASCRIPT -->
  <script src="script.js"></script>
</body>
</html>
